# Cloudflare Worker 配置 · 全站访客计数器
# 部署前必须做：npx wrangler kv namespace create VISITS，把输出里的 id 填到下面
name = "portfolio-visits"
main = "index.mjs"
compatibility_date = "2025-01-01"

[[kv_namespaces]]
binding = "VISITS"
id = "78ccba103c8a444eb1b60e8fb8938e8f"

[vars]
# 允许调用计数接口的来源，逗号分隔；线上只留你的正式域名
ALLOWED_ORIGINS = "https://shenge-work.github.io,http://localhost:8080,http://127.0.0.1:8080"
