name: TEMP CareerAgent card patch

on:
  push:
    paths:
      - '.github/workflows/tmp-careeragent-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-data-sync
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 打补丁
        run: |
          python3 - <<'PY'
          import io
          p = 'data/site-data.json'
          s = io.open(p, encoding='utf-8').read()
          old_desc = '本地服务器部署的求职 Agent 工作台：账号登录 + 行级数据隔离 + PostgreSQL 兼容数据库（PGlite），以岗位为第一公民——简历编辑（A4 实时预览 / 矢量与图片版 PDF）、公司档案、投递追踪（BOSS 聊天采集）、AI 模型转发与本地版本历史，数据全部留在本机。'
          new_desc = '本地优先的 AI 求职 Agent 桌面应用（Windows / macOS 装好即用）：投递追踪、公司调研、简历改写这些杂活交给 AI——按 JD 自动改写简历并导出 PDF、六维公司调研与面试简报、聊天记录归档去重、内推跟进自动提醒；数据存本地 PGlite，只留在本机，换设备走端到端加密同步。'
          assert old_desc in s, 'desc anchor missing'
          s = s.replace(old_desc, new_desc)
          old_tech = '      "tech": [\n        "TypeScript",\n        "Node.js",\n        "PGlite / PostgreSQL"\n      ],'
          new_tech = '      "tech": [\n        "TypeScript",\n        "Node.js",\n        "Electron 桌面端",\n        "PGlite / PostgreSQL"\n      ],'
          assert old_tech in s, 'tech anchor missing'
          s = s.replace(old_tech, new_tech)
          old_gh = '      "github": "https://github.com/shenge-work/career-agent"'
          assert old_gh in s, 'github anchor missing'
          s = s.replace(old_gh, old_gh + ',\n      "live": "https://career-agent-3gi.pages.dev/"')
          io.open(p, 'w', encoding='utf-8').write(s)
          PY
          python3 scripts/sync_site_data.py
      - name: 提交推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site-data.json data/site-data.js
          if git diff --cached --quiet; then echo '无改动'; else git commit -m 'content(works): CareerAgent 卡片更新描述并补充在线访问入口' && git push; fi
